[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-ieeg-features"
version = "0.1.0"
description = "Feature extraction for intracranial sequence-learning analyses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mne>=1.6",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

